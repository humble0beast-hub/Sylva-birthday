<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>For My Stubborn Potato</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--gold:#c8a875;--ivory:#eee7dc}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 42%,#211915 0,#0c0b0b 48%,#050505 100%);color:var(--ivory);font-family:'DM Sans',sans-serif;display:grid;place-items:center;overflow:hidden}.grain{position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}.glow{position:absolute;width:320px;height:320px;border:1px solid #b99a6b20;border-radius:50%;box-shadow:0 0 100px #c8a87512,inset 0 0 80px #c8a87508;animation:breathe 7s ease-in-out infinite}.card{position:relative;width:min(92vw,470px);padding:58px 34px 48px;text-align:center;border:1px solid #c8a87530;background:linear-gradient(145deg,#ffffff08,#ffffff02);backdrop-filter:blur(14px);box-shadow:0 25px 100px #0009}.eyebrow{font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}h1{font:300 clamp(48px,10vw,70px)/.94 'Cormorant Garamond',serif;letter-spacing:-.035em;margin:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}h1 .title-small{font:400 11px/1.5 'DM Sans',sans-serif;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}h1 .title-main{display:block;font-weight:400;white-space:nowrap}h1 .title-main em{font-style:italic;color:#e0c69c;font-weight:300}p{font-size:13px;line-height:1.8;color:#b9b1a7;margin:0 auto 32px;max-width:290px}.line{width:44px;height:1px;background:var(--gold);margin:25px auto}form{display:flex;flex-direction:column;gap:12px}input{width:100%;padding:16px 18px;background:#080808aa;border:1px solid #c8a87550;color:#fff;text-align:center;font:14px 'DM Sans';letter-spacing:.18em;outline:none}input:focus{border-color:var(--gold)}button{padding:16px;background:var(--gold);border:0;color:#17120d;text-transform:uppercase;letter-spacing:.22em;font-size:10px;font-weight:600;cursor:pointer;transition:.25s}button:hover{background:#e0c69c;transform:translateY(-2px)}#error{min-height:20px;color:#d7a4a0;font-size:12px;margin-top:12px}.hint{margin-top:25px!important;margin-bottom:0!important;font-size:10px!important;letter-spacing:.08em;color:#77716b!important}.corner{position:fixed;width:80px;height:80px;border-color:#c8a87555;border-style:solid;opacity:.5}.tl{top:22px;left:22px;border-width:1px 0 0 1px}.br{right:22px;bottom:22px;border-width:0 1px 1px 0}@keyframes breathe{50%{transform:scale(1.08);opacity:.55}}@media(max-width:480px){.card{padding:48px 25px}.corner{width:42px;height:42px}}
</style></head><body><div class="grain"></div><div class="glow"></div><div class="corner tl"></div><div class="corner br"></div><main class="card"><div class="eyebrow">A private little universe</div><h1 aria-label="For My Stubborn Potato"><span class="title-small">For My</span><span class="title-main">Stubborn <em>Potato.</em></span></h1><div class="line"></div><p>Some doors are opened with a key.<br>This one opens with the name I call you.</p><form id="unlock"><input id="password" type="password" placeholder="ENTER THE NAME" autocomplete="off" aria-label="Password"><button type="submit">Enter my little world</button></form><div id="error" role="status"></div><p class="hint">A LITTLE HINT · THE NAME I CALL YOU</p></main><script>document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button'),err=document.getElementById('error');btn.disabled=true;btn.textContent='ONE MOMENT…';err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Try again.');location.href='/';}catch(x){err.textContent=x.message;btn.disabled=false;btn.textContent='Enter my little world';}});</script></body></html>
